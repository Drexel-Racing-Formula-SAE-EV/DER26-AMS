name: AMS Headless CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
      - clean+fix+testHarness
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - clean+fix+testHarness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ams-headless-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest

    steps:
      - name: Manual checkout without external actions
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD

      - name: Check project structure
        run: bash ci/scripts/check_project_structure.sh

      - name: Check repo hygiene
        run: bash ci/scripts/check_repo_hygiene.sh

  host-tests:
    name: AMS unit and host tests
    runs-on: ubuntu-latest
    needs: repo-checks

    steps:
      - name: Manual checkout without external actions
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Run unit tests
        working-directory: AMS/host_tests
        run: |
          make CC=gcc clean
          make CC=gcc unit | tee unit_test_output.txt

      - name: Run comprehensive host tests
        working-directory: AMS/host_tests
        run: |
          make CC=gcc test | tee host_test_output.txt

      - name: Print host test outputs
        if: always()
        working-directory: AMS/host_tests
        run: |
          echo "===== unit_test_output.txt ====="
          test -f unit_test_output.txt && cat unit_test_output.txt || true
          echo "===== host_test_output.txt ====="
          test -f host_test_output.txt && cat host_test_output.txt || true

  gcc-analyzer:
    name: GCC analyzer
    runs-on: ubuntu-latest
    needs: repo-checks

    steps:
      - name: Manual checkout without external actions
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD

      - name: Install analyzer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Run GCC analyzer
        working-directory: AMS/host_tests
        run: |
          make CC=gcc clean
          make CC=gcc analyze

  stm32-headless-build:
    name: STM32 headless ARM-GCC build
    runs-on: ubuntu-latest
    needs:
      - host-tests
      - gcc-analyzer

    steps:
      - name: Manual checkout without external actions
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi make python3

      - name: Build AMS firmware headlessly
        run: bash ci/stm32/build_ams_headless_gcc.sh

      - name: Generate firmware size report
        run: |
          mkdir -p ci_artifacts
          python3 ci/scripts/firmware_size_report.py --elf AMS/build/DER26-AMS.elf --out ci_artifacts/firmware_size_report.md

      - name: Check firmware size limits
        run: |
          python3 ci/scripts/check_firmware_size.py --elf AMS/build/DER26-AMS.elf --max-text 262144 --max-data 8192 --max-bss 65536

      - name: Print firmware build outputs
        if: always()
        run: |
          echo "===== Firmware build directory ====="
          ls -lh AMS/build || true
          echo "===== Firmware size report ====="
          test -f ci_artifacts/firmware_size_report.md && cat ci_artifacts/firmware_size_report.md || true

      - name: Write firmware size to workflow summary
        if: always()
        run: |
          if [ -f ci_artifacts/firmware_size_report.md ]; then
            cat ci_artifacts/firmware_size_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
